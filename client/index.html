<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Stempy ERP</title>
    <!--
      Development CSP. In production the main process serves app://stempy with a
      stricter header (src/main/index.ts); the renderer never calls the server itself.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; object-src 'none'; base-uri 'none'"
    />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
